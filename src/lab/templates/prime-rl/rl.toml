# Prime Intellect Hosted Training config (fields from `prime train init`, prime CLI 2026-09-20).
# See trainable models, capacity and token prices with `prime train models`.

model = "Qwen/Qwen3.5-0.8B"
loss = "rl"            # "rl" | "sft"
max_steps = 100

# Training
batch_size = 128
rollouts_per_example = 8
# learning_rate = 3e-5  # default is 1e-4

[sampling]
max_tokens = 2048
# temperature = 0.7

# Environment from the Environments Hub (or your own verifiers env pushed there).
[[env]]
id = "primeintellect/reverse-text"
# args = { split = "train", max_examples = 1000 }

# Online eval: gives a held-out number to judge the run by.
[eval]
interval = 25
num_examples = 64
rollouts_per_example = 1

[[eval.env]]
id = "primeintellect/reverse-text"
# args = { split = "test" }

# [checkpoints]
# interval = 50
# keep_cloud = 3
